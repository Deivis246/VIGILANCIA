          minimum: 0
        drainDays:
          type: ["number", "null"]
          multipleOf: 1
          minimum: 0
        dialysisCatheterDays:
          type: ["number", "null"]
          multipleOf: 1
          minimum: 0
        cultureType:
          type: string
          enum: [none, urine, blood, respiratory, other]
        cultureStatus:
          type: string
          enum: [pending, negative, positive]
        cultureOrganism:
          type: string
          maxLength: 120
        culturePositiveDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        rectalSwabStatus:
          type: string
          enum: [pending, negative, positive]
        rectalSwabOrganism:
          type: string
