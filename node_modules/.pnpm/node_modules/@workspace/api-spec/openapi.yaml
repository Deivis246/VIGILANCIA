    VigilanciaCensusApplyInput:
      type: object
      properties:
        rows:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VigilanciaCensusRowInput"
      required: [rows]
    VigilanciaCensusApplyResponse:
      type: object
      properties:
        appliedCount:
          type: number
          multipleOf: 1
