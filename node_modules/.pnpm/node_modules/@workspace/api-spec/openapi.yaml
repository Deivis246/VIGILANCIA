        rectalSwabPositiveDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isolation:
          type: string
          maxLength: 120
        censusDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [occupied, patientCode, age, affiliation, diagnosis, stayDays, urinaryCatheterDays, nasogastricTubeDays, centralLineDays, drainDays, dialysisCatheterDays, cultureType, cultureStatus, cultureOrganism, rectalSwabStatus, rectalSwabOrganism, isolation, censusDate]
    VigilanciaCensusRowInput:
      type: object
      properties:
        bedId:
          type: string
          pattern: "^(20[1-9]|21[0-1]|2[12][0-3])-[abc]$"
        occupied:
          type: boolean
        patientCode:
          type: string
          maxLength: 20
        age:
